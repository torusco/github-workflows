name: Trivy Vulnerability Scanner v8.1

on:
  workflow_call:
    inputs:
      REGISTRY:
        description: "Docker registry (e.g., 'your-registry.com' or 'docker.io')"
        required: true
        type: string
      
      REPOSITORY:
        description: "Docker repository and tag (e.g., 'image:tag' or 'namespace/image:tag')"
        required: true
        type: string

      SEVERITY:
        description: "Comma-separated list of severities to check (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
        required: false
        type: string
        default: "CRITICAL"

      EXIT_CODE:
        description: "Exit code when vulnerabilities are found (0 = continue, 1 = fail pipeline)"
        required: false
        type: string
        default: "1"

      FORMAT:
        description: "Output format (table, json, sarif, cyclonedx, spdx, spdx-json, github, cosign-vuln)"
        required: false
        type: string
        default: "table"

      OUTPUT_FILE:
        description: "Output file name for scan results"
        required: false
        type: string
        default: "trivy-results.txt"

      RUNS_ON:
        description: "The runner to use"
        type: string
        required: false
        default: "ubuntu-latest"

      SLACK_CHANNEL_ID:
        type: string
        required: false

      TARGET_AWS_ACCOUNT_ROLE_ARN:
        description: "AWS role ARN for ECR access"
        type: string
        required: false

      AWS_REGION:
        description: "AWS region for ECR access"
        type: string
        required: false
        default: "us-east-1"

    outputs:
      SCAN_COMPLETED:
        description: "Whether the scan was completed"
        value: ${{ jobs.trivy_scan.outputs.SCAN_COMPLETED }}

    secrets:
      # Only required if using slack notifications
      SLACK_BOT_TOKEN:
        required: false

jobs:
  trivy_scan:
    runs-on: ${{ inputs.RUNS_ON }}
    
    permissions: 
      id-token: write
      contents: read

    outputs:
      SCAN_COMPLETED: "true"

    steps:
      - name: Echo inputs
        run: |
          echo "REGISTRY: ${{ inputs.REGISTRY }}"
          echo "REPOSITORY: ${{ inputs.REPOSITORY }}"
          echo "Full Image: ${{ inputs.REGISTRY }}/${{ inputs.REPOSITORY }}"
          echo "SEVERITY: ${{ inputs.SEVERITY }}"
          echo "EXIT_CODE: ${{ inputs.EXIT_CODE }}"
          echo "FORMAT: ${{ inputs.FORMAT }}"
          echo "OUTPUT_FILE: ${{ inputs.OUTPUT_FILE }}"
          echo "RUNS_ON: ${{ inputs.RUNS_ON }}"
          echo "SLACK_CHANNEL_ID: ${{ inputs.SLACK_CHANNEL_ID }}"
          echo "TARGET_AWS_ACCOUNT_ROLE_ARN: ${{ inputs.TARGET_AWS_ACCOUNT_ROLE_ARN }}"
          echo "AWS_REGION: ${{ inputs.AWS_REGION }}"
          echo "GITHUB_RUN_URL_FOR_SLACK=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_ENV

      - name: Configure AWS credentials for ECR access
        if: ${{ inputs.TARGET_AWS_ACCOUNT_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0 Feb2026
        with:
          role-to-assume: ${{ inputs.TARGET_AWS_ACCOUNT_ROLE_ARN }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Slack Scan Start
        id: slack
        if: ${{ inputs.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1 Feb2026
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ inputs.SLACK_CHANNEL_ID }}
            text: ":large_yellow_circle: :shield: :${{ github.event.repository.name }}: Starting Trivy vulnerability scan for ${{ inputs.REPOSITORY }} <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action>"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #  v0.36.0 Apr2026
        with:
          scan-type: image
          image-ref: ${{ inputs.REGISTRY }}/${{ inputs.REPOSITORY }}:latest
          format: 'table'
          exit-code: ${{ inputs.EXIT_CODE }}
          severity: ${{ inputs.SEVERITY }}
          ignore-unfixed: true
 
      - name: Slack Scan Complete
        if: ${{ success() && inputs.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 #v3.0.1 Feb2026
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ inputs.SLACK_CHANNEL_ID }}
            ts: ${{ fromJson(steps.slack.outputs.response).ts }}
            text: ":check-passed: :shield: :${{ github.event.repository.name }}: Trivy vulnerability scan completed for ${{ inputs.REPOSITORY }} - No critical vulnerabilities found <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action>"

      - name: Slack Scan Failure
        if: ${{ failure() && inputs.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 #v3.0.1 Feb2026
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ inputs.SLACK_CHANNEL_ID }}
            ts: ${{ fromJson(steps.slack.outputs.response).ts }}
            text: ":check-failed: :shield: :${{ github.event.repository.name }}: Trivy vulnerability scan failed for ${{ inputs.REPOSITORY }} - Vulnerabilities found or scan error <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action>"

      - name: Slack Scan Cancelled
        if: ${{ cancelled() && inputs.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 #v3.0.1 Feb2026
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ inputs.SLACK_CHANNEL_ID }}
            ts: ${{ fromJson(steps.slack.outputs.response).ts }}
            text: ":black_square_for_stop: :shield: :${{ github.event.repository.name }}: Trivy vulnerability scan cancelled for ${{ inputs.REPOSITORY }} <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action>"
