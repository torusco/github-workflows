name: "Python Run v8.1"

on:
  workflow_call:
    inputs:
      AWS_REGION:
        type: string
        required: true

      CDK_PREFIX:
        description: environment instance name is used to select the environment gate and to deploy code
        type: string
        required: true

      ENVIRONMENT_LONG_NAME:
        type: string
        required: true

      PY_FOLDER_NAME:
        description: "use this folder py- folder that contains the script, requirements.txt, and other files"
        type: string
        required: true

      PY_RUN_COMMAND:
        type: string
        required: true
    
      PY_VERSION:
        description: "the python version to install, ex 3.10 or 3.11, default is latest 3.12"
        type: string
        required: false
        default: '3.12'
  
      REQUIREMENTS_FILE:
        description: "path to requirements file relative to PY_FOLDER_NAME, default is requirements.txt"
        type: string
        required: false
        default: 'requirements.txt'
  
      RUNS_ON:
        type: string
        required: false
        default: ubuntu-latest

      SLACK_CHANNEL_ID:
        type: string
        required: false

      TARGET_AWS_ACCOUNT_ROLE_ARN:
        type: string
        required: true

      UPLOAD_ARTIFACTS:
        type: string
        required: false

      # put uses flags at end
      USES_CLOUDFLARE:
        type: boolean
        required: false
        default: false

      USES_COLLATE:
        type: boolean
        required: false
        default: false
  
      USES_FIVETRAN:
        type: boolean
        required: false
        default: false
  
      USES_METABASE:
        type: boolean
        required: false
        default: false

      USES_PIP:
        type: boolean
        required: false
        default: true
    
      USES_POETRY:
        type: boolean
        required: false
        default: false
    
      USES_UV:
        type: boolean
        required: false
        default: false
    
      USES_POSTMAN:
        type: boolean
        required: false
        default: false
  
      USES_POSTMAN_APP_AND_DATA:
        type: boolean
        required: false
        default: false

      USES_STRIPE:
        type: boolean
        required: false
        default: false

    secrets:
      # only required if using collate provider
      COLLATE_JWT_TOKEN:
        required: false

      # only required if using cloudflare provider
      CLOUDFLARE_API_TOKEN: 
        required: false

      # only required if using fivetran provider
      FIVETRAN_APIKEY: 
        required: false

      # only required if using fivetran provider
      FIVETRAN_APISECRET: 
        required: false

      # only required if USES_METABASE
      METABASE_API_KEY: 
        required: false
  
      # only required if using postman provider single
      POSTMAN_API_KEY: 
        required: false

      # only required if using postman provider dual app and data
      POSTMAN_API_KEY_APP: 
        required: false
      POSTMAN_API_KEY_DATA: 
        required: false
  
      # only required if using stripe provider
      STRIPE_API_KEY: 
        required: false

      # only required if using slack provider
      SLACK_BOT_TOKEN:
        required: false

      # required for GITHUB checkout / NPM_TOKEN on other workflows
      CHECKOUT_TOKEN:
        required: true

jobs:

  python_run:

    runs-on: ${{ inputs.RUNS_ON }}

    permissions: # github oidc
      id-token: write
      contents: read

    steps:

      - name: echo
        run: |
          echo AWS_REGION ${{ inputs.AWS_REGION }}
          echo CDK_PREFIX ${{ inputs.CDK_PREFIX }}
          echo ENVIRONMENT_LONG_NAME ${{ inputs.ENVIRONMENT_LONG_NAME }}
          echo PY_FOLDER_NAME ${{ inputs.PY_FOLDER_NAME }}
          echo PY_RUN_COMMAND ${{ inputs.PY_RUN_COMMAND }}
          echo PY_VERSION ${{ inputs.PY_VERSION }}
          echo REQUIREMENTS_FILE ${{ inputs.REQUIREMENTS_FILE }}
          echo RUNS_ON ${{ inputs.RUNS_ON }}
          echo SLACK_CHANNEL_ID ${{ inputs.SLACK_CHANNEL_ID }}
          echo TARGET_AWS_ACCOUNT_ROLE_ARN ${{ inputs.TARGET_AWS_ACCOUNT_ROLE_ARN }}
          echo USES_CLOUDFLARE ${{ inputs.USES_CLOUDFLARE }}
          echo USES_COLLATE ${{ inputs.USES_COLLATE }}
          echo USES_FIVETRAN ${{ inputs.USES_FIVETRAN }}
          echo USES_METABASE ${{ inputs.USES_METABASE }}
          echo USES_PIP ${{ inputs.USES_PIP }}
          echo USES_POETRY ${{ inputs.USES_POETRY }}
          echo USES_UV ${{ inputs.USES_UV }}
          echo USES_POSTMAN ${{ inputs.USES_POSTMAN }}
          echo USES_POSTMAN_APP_AND_DATA ${{ inputs.USES_POSTMAN_APP_AND_DATA }}
          echo USES_STRIPE ${{ inputs.USES_STRIPE }}
          echo "GITHUB_RUN_URL_FOR_SLACK=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_ENV

      - if: github.event.client_payload.ref != ''
        name: GITHUB_CHECKOUT_REF
        run: |
          echo "use ${{ github.event.client_payload.ref }} not ${{ github.ref }}"
          echo "GITHUB_CHECKOUT_REF=${{ github.event.client_payload.ref_name }}" >> $GITHUB_ENV
          echo "GITHUB_VERSION_URL_FOR_SLACK=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${{ github.event.client_payload.ref_name }}" >> $GITHUB_ENV

      - if: github.event.client_payload.ref != ''
        name: actions/checkout@v4 client payload ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }} # matches github-torus-packages - repo, packages
          ref: ${{ github.event.client_payload.ref }}

      - if: github.event.client_payload.ref == ''
        name: GITHUB_CHECKOUT_REF
        run: |
          echo "use default ${{ github.ref }}"
          echo "GITHUB_CHECKOUT_REF=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "GITHUB_VERSION_URL_FOR_SLACK=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${{ github.ref_name }}" >> $GITHUB_ENV

      - if: github.event.client_payload.ref == ''
        name: actions/checkout@v4 default ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }} # matches github-torus-packages - repo, packages

      - name: Set up Python ${{ inputs.PY_VERSION }}
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ inputs.PY_VERSION }}
            
      - name: pip install
        if: "${{ inputs.USES_PIP != '' }}"
        run: |
            cd ${{ inputs.PY_FOLDER_NAME }}
            pip install -r ${{ inputs.REQUIREMENTS_FILE }}

      - name: install poetry
        if: "${{ inputs.USES_POETRY != '' }}"
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
    
      - name: poetry install
        if: "${{ inputs.USES_POETRY != '' }}"
        run: |
            cd ${{ inputs.PY_FOLDER_NAME }}
            poetry install
    
      - name: install uv
        if: "${{ inputs.USES_UV != '' }}"
        uses: astral-sh/setup-uv@v3
        with:
          # set to false since no uv lock / pyproject.toml
          enable-cache: false
    
      - name: uv sync
        if: "${{ inputs.USES_UV != '' }}"
        run: |
            cd ${{ inputs.PY_FOLDER_NAME }}
            if [ -f "pyproject.toml" ]; then
              uv sync
            else
              uv pip install --system -r ${{ inputs.REQUIREMENTS_FILE }}
            fi
    
      - name: ENV VARS
        run: |
          echo "CDK_PREFIX=${{ inputs.CDK_PREFIX }}" >> $GITHUB_ENV
          echo "ENVIRONMENT_LONG_NAME=${{ inputs.ENVIRONMENT_LONG_NAME }}" >> $GITHUB_ENV

      - name: Deployer Role with Github OIDC Provider
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
            role-to-assume: ${{inputs.TARGET_AWS_ACCOUNT_ROLE_ARN}}
            aws-region: ${{inputs.AWS_REGION}}

      - name: Collate Variables
        if: "${{ inputs.USES_COLLATE != '' }}"
        run: |
          echo "COLLATE_JWT_TOKEN=${{ secrets.COLLATE_JWT_TOKEN }}" >> $GITHUB_ENV
      
      - name: CloudFlare Variables
        if: "${{ inputs.USES_CLOUDFLARE != '' }}"
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
  
      - name: Fivetran Variables
        if: "${{ inputs.USES_FIVETRAN != '' }}"
        run: |
          echo "FIVETRAN_APIKEY=${{ secrets.FIVETRAN_APIKEY }}" >> $GITHUB_ENV
          echo "FIVETRAN_APISECRET=${{ secrets.FIVETRAN_APISECRET }}" >> $GITHUB_ENV
  
      - name: Metabase Variables
        if: "${{ inputs.USES_METABASE != '' }}"
        run: |
          # TODO REMOVE USER PASS AFTER https://github.com/torusco/data-infra/pull/490
          echo "METABASE_API_KEY=${{ secrets.METABASE_API_KEY }}" >> $GITHUB_ENV

      - name: Postman Variables Single Team
        if: "${{ inputs.USES_POSTMAN != '' }}"
        run: |
          echo "POSTMAN_API_KEY=${{ secrets.POSTMAN_API_KEY }}" >> $GITHUB_ENV
  
      - name: Postman Variables Both App and Data Team
        if: "${{ inputs.USES_POSTMAN_APP_AND_DATA != '' }}"
        run: |
          echo "TF_VAR_POSTMAN_API_KEY_APP=${{ secrets.POSTMAN_API_KEY_APP }}" >> $GITHUB_ENV
          echo "TF_VAR_POSTMAN_API_KEY_DATA=${{ secrets.POSTMAN_API_KEY_DATA }}" >> $GITHUB_ENV
  
      - name: Stripe Variables
        if: "${{ inputs.USES_STRIPE != '' }}"
        run: |
          echo "STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}" >> $GITHUB_ENV
  
      - name: Slack PY Start
        id: slack
        if: "${{ inputs.SLACK_CHANNEL_ID != ''}}"
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          channel-id: ${{ inputs.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text" : ":large_yellow_circle: :python: Running! :${{ github.event.repository.name }}: ${{ github.event.repository.name }} ${{ inputs.PY_FOLDER_NAME }} <${{ env.GITHUB_VERSION_URL_FOR_SLACK }}|${{ env.GITHUB_CHECKOUT_REF }}> to ${{ inputs.ENVIRONMENT_LONG_NAME }} ${{ inputs.CDK_PREFIX }} <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action> "
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Python Run
        run: |
          cd ${{ inputs.PY_FOLDER_NAME }}
          ${{ inputs.PY_RUN_COMMAND }}
          
      - name: Upload Artifacts
        if: "${{ inputs.UPLOAD_ARTIFACTS != ''}}"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ${{ inputs.UPLOAD_ARTIFACTS}}

      - name: Slack PY Complete
        if: "${{ inputs.SLACK_CHANNEL_ID != ''}}"
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          channel-id: ${{ inputs.SLACK_CHANNEL_ID }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "text" : ":check-passed: :python: :${{ github.event.repository.name }}: ${{ github.event.repository.name }} ${{ inputs.PY_FOLDER_NAME }} <${{ env.GITHUB_VERSION_URL_FOR_SLACK }}|${{ env.GITHUB_CHECKOUT_REF }}> deployed to ${{ inputs.ENVIRONMENT_LONG_NAME }} ${{ inputs.CDK_PREFIX }} <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action> "
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Slack PY Failure
        if: "${{ failure() && inputs.SLACK_CHANNEL_ID != '' }}"
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          channel-id: ${{ inputs.SLACK_CHANNEL_ID }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "text" : ":check-failed: :python: :${{ github.event.repository.name }}: ${{ github.event.repository.name }} ${{ inputs.PY_FOLDER_NAME }} <${{ env.GITHUB_VERSION_URL_FOR_SLACK }}|${{ env.GITHUB_CHECKOUT_REF }}> not deployed to ${{ inputs.ENVIRONMENT_LONG_NAME }} ${{ inputs.CDK_PREFIX }} <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action> "
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Slack Python Cancelled
        if: "${{ cancelled() && inputs.SLACK_CHANNEL_ID != '' }}"
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          channel-id: ${{ inputs.SLACK_CHANNEL_ID }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "text" : ":black_square_for_stop: :python: :${{ github.event.repository.name }}: ${{ github.event.repository.name }} ${{ inputs.PY_FOLDER_NAME }} <${{ env.GITHUB_VERSION_URL_FOR_SLACK }}|${{ env.GITHUB_CHECKOUT_REF }}> cancelled deploy to ${{ inputs.ENVIRONMENT_LONG_NAME }} ${{ inputs.CDK_PREFIX }} <${{ env.GITHUB_RUN_URL_FOR_SLACK }}|Action> "
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
